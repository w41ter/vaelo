syntax = "proto3";
package showcase;

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

message WatchRequest {
  uint32 count = 1;
}

message Chunk {
  bytes data = 1;
}

message UploadSummary {
  uint64 bytes_received = 1;
}

message ChatMessage {
  string sender = 1;
  string text = 2;
}

service Showcase {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Fail(EchoRequest) returns (EchoResponse);
  rpc Slow(EchoRequest) returns (EchoResponse);
  rpc Watch(WatchRequest) returns (stream EchoResponse);
  rpc Upload(stream Chunk) returns (UploadSummary);
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}
